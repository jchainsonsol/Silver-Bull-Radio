<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Bull Radio W3BC — V19</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}#shell{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="shell" src="preview-v18.html?v=v19" title="Silver Bull Radio"></iframe><audio id="v19Open" preload="auto" src="audio/welcome-to-the-bullpen.mp3"></audio><audio id="v19Bed" preload="auto" loop src="audio/beds/sunset-gate.mp3"></audio><script>
const shell=document.getElementById('shell'),openAudio=document.getElementById('v19Open'),openBed=document.getElementById('v19Bed');let hourly=null,liveCfg=null,openRunning=false,openStart=0;
const $d=()=>{try{const v18d=shell.contentDocument,v17=v18d.getElementById('shell');const v17d=v17?.contentDocument,board=v17d?.getElementById('board');return{v18d,v17,v17d,board,doc:board?.contentDocument,win:board?.contentWindow,v17w:v17?.contentWindow}}catch(e){return{}}};
function fmt(s){if(!Number.isFinite(s)||s<0)return'--:--';s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function now(title,sub,left='--:--',kind='segment'){const {doc}= $d();if(!doc)return;const map={nowTitle:title,nowSub:sub,nowLeft:left,nowKind:kind};Object.entries(map).forEach(([id,val])=>{const e=doc.getElementById(id);if(e)e.textContent=val})}
async function loadData(){try{const r=await fetch('data/news-hourly.json?v='+Date.now(),{cache:'no-store'});if(r.ok)hourly=await r.json()}catch(e){}try{const r=await fetch('data/live-config.json?v='+Date.now(),{cache:'no-store'});if(r.ok)liveCfg=await r.json()}catch(e){}}
function currentHour(doc){return doc.getElementById('briefHour')?.value||'9'}
function hourLabel(h){return h==='9'?'9–10 AM':h==='10'?'10–11 AM':h==='11'?'11 AM–12 PM':'12–1 PM'}
function setXDraft(text,openTab=false){const {doc}= $d();if(!doc)return;const ta=doc.getElementById('xText');if(ta)ta.value=text;const tab=doc.querySelector('[data-screen="social"]');if(openTab&&tab)tab.click()}
async function tweetHour(h){if(!hourly)return;setXDraft(hourly.hours[h]?.tweet||'',true)}
function renderQuickNews(){const {doc}= $d();if(!doc||!hourly)return;const h=currentHour(doc),info=hourly.hours[h],q=doc.getElementById('quickRundown');if(!q||!info)return;const panel=q.closest('.panel');if(panel){const title=panel.querySelector('.head h2');if(title)title.textContent='Hourly News Briefing';const right=panel.querySelector('.head .mut');if(right)right.textContent=hourLabel(h)}q.innerHTML=`<div class="story"><b>${info.title}</b><p style="font-size:11px;line-height:1.5">${info.summary}</p><button class="mini cyan" id="v19TweetHour">TWEET THIS HOUR</button></div>${info.stories.slice(0,5).map(s=>`<div class="story"><b>${s.headline}</b><p>${s.context}</p><div class="small"><strong>Talk:</strong> ${s.talking_point}</div></div>`).join('')}`;doc.getElementById('v19TweetHour').onclick=()=>tweetHour(h)}
function renderNewsTab(){const {doc}= $d();if(!doc||!hourly)return;const sec=doc.getElementById('news');if(!sec)return;[...sec.children].forEach(c=>c.style.display='none');let panel=doc.getElementById('v19NewsPanel');if(!panel){panel=doc.createElement('div');panel.id='v19NewsPanel';panel.className='panel';sec.prepend(panel)}panel.style.display='block';panel.innerHTML=`<div class="head"><h2>Hourly News Producer Board</h2><span class="mut">all strong stories · context · talking points · tweet-ready</span></div><div class="body"><div class="row" id="v19NewsTabs">${['9','10','11','12'].map(h=>`<button class="mini ${h==='9'?'cyan':''}" data-v19h="${h}">${hourLabel(h)}</button>`).join('')}</div><div id="v19NewsBody" style="margin-top:8px"></div></div>`;panel.querySelectorAll('[data-v19h]').forEach(b=>b.onclick=()=>{panel.querySelectorAll('[data-v19h]').forEach(x=>x.classList.remove('cyan'));b.classList.add('cyan');renderNewsHour(b.dataset.v19h)});renderNewsHour('9')}
function renderNewsHour(h){const {doc}= $d();if(!doc||!hourly)return;const info=hourly.hours[h],root=doc.getElementById('v19NewsBody');if(!info||!root)return;root.innerHTML=`<div class="story" style="border-color:rgba(57,216,255,.45)"><b style="font-size:14px">${info.title}</b><p style="font-size:11px;line-height:1.55">${info.summary}</p><div class="row"><button class="mini cyan" id="v19TweetSummary">TWEET THIS HOUR</button><button class="mini" id="v19SendToControl">SHOW ON CONTROL</button></div></div>${info.stories.map((s,i)=>`<div class="story"><b>${i+1}. ${s.headline}</b><p><strong>${s.source}</strong> · ${s.context}</p><div class="small"><strong>TALKING POINT:</strong> ${s.talking_point}</div></div>`).join('')}`;doc.getElementById('v19TweetSummary').onclick=()=>tweetHour(h);doc.getElementById('v19SendToControl').onclick=()=>{const sel=doc.getElementById('briefHour');if(sel)sel.value=h;renderQuickNews();doc.querySelector('[data-screen="control"]')?.click()}}
async function goLive(){if(openRunning)return;openRunning=true;openAudio.pause();openBed.pause();openAudio.currentTime=0;openBed.currentTime=0;openBed.volume=0;openStart=Date.now();try{await openAudio.play();now('Show Open','Welcome to the Bullpen opener',fmt(openAudio.duration||0),'SHOW OPEN')}catch(e){openRunning=false;now('GO LIVE ERROR',e.message,'--:--','ERROR')}}
openAudio.ontimeupdate=()=>{if(openRunning)now('Show Open','Welcome to the Bullpen opener',fmt((openAudio.duration||0)-openAudio.currentTime),'SHOW OPEN')};
openAudio.onended=async()=>{try{openBed.volume=.08;await openBed.play()}catch(e){}const {doc}= $d();try{const r=await fetch('data/opening-monologue.txt?v='+Date.now(),{cache:'no-store'});if(r.ok){const txt=await r.text(),ta=doc?.getElementById('mainScript');if(ta)ta.value=txt}}catch(e){}openRunning=false;now('Morning Monologue','Your mic · Sunset Gate bed underneath','--:--','MIC')};
function stopOpen(){openRunning=false;openAudio.pause();openBed.pause();openAudio.currentTime=0;openBed.currentTime=0}
function playingSong(){const {doc}= $d();if(!doc)return null;const a=doc.getElementById('deckA'),b=doc.getElementById('deckB');for(const x of [a,b]){if(x&&!x.paused&&!x.ended&&Number.isFinite(x.duration)&&x.duration>0){return{x,left:x.duration-x.currentTime,pct:x.currentTime/x.duration*100}}}return null}
function patchTimers(){const {doc}= $d();if(!doc)return;const song=playingSong();if(song&&!openRunning){const title=doc.getElementById('musicNow')?.textContent||'Music';now(title,'Music run · automatic crossfade',fmt(song.left),'SONG');const sl=doc.getElementById('songLeft');if(sl)sl.textContent=fmt(song.left)} }
function patchGoLive(){const {doc}= $d();if(!doc)return;const b=doc.getElementById('goLive');if(b){b.onclick=goLive;b.innerHTML='GO LIVE<span>One tap · opener → monologue bed</span>'}const stop=doc.getElementById('stopAll');if(stop){const old=stop.onclick;stop.onclick=e=>{stopOpen();if(typeof old==='function')old.call(stop,e)}}}
function addAIEnhancer(){const {doc}= $d();if(!doc)return;const ta=doc.getElementById('xText'),open=doc.getElementById('openXPost');if(!ta||!open||doc.getElementById('v19AiEnhance'))return;const b=doc.createElement('button');b.id='v19AiEnhance';b.className='mini purple';b.textContent='AI ENHANCE ↗';b.onclick=async()=>{const draft=ta.value.trim();if(!draft)return;const prompt=`Improve this X post for Silver Bull Radio. Keep it concise, punchy, natural, and credible. Preserve all factual claims and links exactly. Do not add hashtags unless they materially help. Return only the improved post.\n\nDRAFT:\n${draft}`;try{await navigator.clipboard.writeText(prompt)}catch(e){}window.open('https://chatgpt.com/','_blank');const note=doc.createElement('span');note.className='small';note.textContent='Enhancer prompt copied — paste into ChatGPT.';b.after(note);setTimeout(()=>note.remove(),5000)};open.parentElement.insertBefore(b,open)}
function patchSpace(){const {doc}= $d();if(!doc||!liveCfg)return;const a=[...doc.querySelectorAll('a')].find(x=>(x.textContent||'').includes('OPEN X'));if(a)a.href=liveCfg.space}
function wire(){const wait=()=>{const {doc}= $d();if(!doc||!doc.getElementById('control'))return setTimeout(wait,100);patchGoLive();renderQuickNews();renderNewsTab();addAIEnhancer();patchSpace();const sel=doc.getElementById('briefHour');if(sel)sel.addEventListener('change',renderQuickNews);setInterval(patchTimers,250)};wait()}
(async()=>{await loadData();shell.addEventListener('load',wire)})();
</script></body></html>
