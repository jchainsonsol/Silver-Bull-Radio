<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silver Bull Radio">
<title>Silver Bull Radio W3BC — Bullpen Control Room</title>
<link rel="manifest" href="manifest.webmanifest?v=20260811">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260811">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=20260811">
<link id="favicon" rel="icon" type="image/webp">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}
#board{border:0;width:100%;height:100%;display:block;background:#07090c}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#07090c;color:#c9b8ff;font:800 15px system-ui;z-index:10}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">Loading Silver Bull Radio W3BC…</div>
<iframe id="board" src="preview-v19.html?production=20260812-0825" title="Silver Bull Radio W3BC — Bullpen Control Room"></iframe>
<script>
const board=document.getElementById('board');
const boot=document.getElementById('boot');
const BED_KEY='sbrBedVolumePct';
const BED_GRAPHS=new Map();
let mixerPrimed=false;

function getBedPct(){
  const raw=localStorage.getItem(BED_KEY);
  if(raw===null)return 2.5;
  const n=Number(raw);
  return Number.isFinite(n)&&n>=0&&n<=20?n:2.5;
}
function bedLevel(){return getBedPct()/100}
function pctText(n){return Number(n).toFixed(2).replace(/\.00$/,'').replace(/0$/,'')+'%'}

async function loadFavicon(){
  try{
    const r=await fetch('assets/silver-bull-radio-logo.b64?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const b64=(await r.text()).trim();
    document.getElementById('favicon').href='data:image/webp;base64,'+b64;
  }catch(e){}
}

function tree(){
  try{
    const v19=board.contentDocument;
    const v19w=board.contentWindow;
    const v18Frame=v19?.getElementById('shell');
    const v18=v18Frame?.contentDocument;
    const v18w=v18Frame?.contentWindow;
    const v17Frame=v18?.getElementById('shell');
    const v17=v17Frame?.contentDocument;
    const v17w=v17Frame?.contentWindow;
    const baseFrame=v17?.getElementById('board');
    const base=baseFrame?.contentDocument;
    const basew=baseFrame?.contentWindow;
    return{v19,v19w,v18,v18w,v17,v17w,base,basew};
  }catch(e){return{}}
}
function findControlDoc(){return tree().base||null}

function isBedAudio(a){
  if(!a)return false;
  const id=(a.id||'').toLowerCase();
  const src=(a.currentSrc||a.getAttribute('src')||'').toLowerCase();
  return id.includes('bed')||src.includes('/beds/')||src.includes('sunset-gate');
}

function ensureBedGraph(audio){
  if(!audio||!isBedAudio(audio))return null;
  if(BED_GRAPHS.has(audio))return BED_GRAPHS.get(audio);
  try{
    const win=audio.ownerDocument?.defaultView;
    const AC=win?.AudioContext||win?.webkitAudioContext;
    if(!AC)return null;
    const ctx=new AC();
    const source=ctx.createMediaElementSource(audio);
    const gain=ctx.createGain();
    gain.gain.value=bedLevel();
    source.connect(gain);
    gain.connect(ctx.destination);
    try{audio.volume=1}catch(e){}
    const graph={ctx,source,gain,audio};
    BED_GRAPHS.set(audio,graph);
    audio.addEventListener('volumechange',()=>{
      if(BED_GRAPHS.has(audio)&&audio.volume!==1){try{audio.volume=1}catch(e){}}
    });
    return graph;
  }catch(e){
    console.warn('Silver Bull bed gain setup failed',e);
    return null;
  }
}

function discoverBeds(){
  const {v19,v18,v17,base}=tree();
  [v19,v18,v17,base].filter(Boolean).forEach(root=>{
    [...root.querySelectorAll('audio')].filter(isBedAudio).forEach(ensureBedGraph);
  });
}

function setGraphGain(graph,target,ms=35,done){
  if(!graph)return done&&done();
  const t=graph.ctx.currentTime;
  const p=graph.gain.gain;
  try{
    p.cancelScheduledValues(t);
    p.setValueAtTime(p.value,t);
    p.linearRampToValueAtTime(Math.max(0,target),t+Math.max(0,ms)/1000);
  }catch(e){p.value=Math.max(0,target)}
  if(done)setTimeout(done,Math.max(0,ms)+20);
}

function applyGainLive(){
  const target=bedLevel();
  BED_GRAPHS.forEach(g=>{
    try{if(g.audio.volume!==1)g.audio.volume=1}catch(e){}
    setGraphGain(g,target,25);
  });
}

function primeMixer(){
  discoverBeds();
  mixerPrimed=true;
  BED_GRAPHS.forEach(g=>{
    try{if(g.ctx.state==='suspended')g.ctx.resume()}catch(e){}
  });
  applyGainLive();
  patchNewswireFade();
}

function patchNewswireFade(){
  const {v17w}=tree();
  if(!v17w||v17w.__sbrGainFadePatched||typeof v17w.fade!=='function')return;
  const original=v17w.fade;
  v17w.__sbrOriginalFade=original;
  v17w.fade=function(audio,to,ms,done){
    if(isBedAudio(audio)){
      const graph=BED_GRAPHS.get(audio)||ensureBedGraph(audio);
      if(graph){
        try{audio.volume=1}catch(e){}
        const target=Number(to)<=0?0:bedLevel();
        setGraphGain(graph,target,ms,done);
        return;
      }
    }
    return original(audio,to,ms,done);
  };
  v17w.__sbrGainFadePatched=true;
}

function lockProductionBrand(d){
  const brandSub=d.querySelector('.brand .mut');
  if(brandSub){
    brandSub.textContent='Bullpen Control Room';
    if(!brandSub.dataset.prodLocked){
      brandSub.dataset.prodLocked='1';
      new MutationObserver(()=>{
        if(brandSub.textContent!=='Bullpen Control Room')brandSub.textContent='Bullpen Control Room';
      }).observe(brandSub,{childList:true,characterData:true,subtree:true});
    }
  }
  const h1=d.querySelector('.brand h1');
  if(h1)h1.textContent='SILVER BULL RADIO W3BC';
}

function addBedSlider(d){
  if(d.getElementById('prodBedVolume'))return;
  const control=d.getElementById('control');
  if(!control)return;
  const panel=control.querySelector('.panel');
  const body=panel?.querySelector('.body');
  if(!body)return;
  const pct=getBedPct();
  const row=d.createElement('div');
  row.id='prodBedVolume';
  row.className='prodBedVolume';
  row.innerHTML=`
    <div class="prodBedLabel"><b>BED VOLUME</b><span>live Web Audio mix · saved on this device</span></div>
    <input id="prodBedSlider" type="range" min="0" max="10" step="0.25" value="${pct}" aria-label="Music bed volume">
    <div id="prodBedValue" class="prodBedValue">${pctText(pct)}</div>
    <button id="prodBedMute" class="mini">MUTE BED</button>
  `;
  body.appendChild(row);

  const slider=d.getElementById('prodBedSlider');
  const value=d.getElementById('prodBedValue');
  const mute=d.getElementById('prodBedMute');
  const update=()=>{
    const n=Number(slider.value);
    localStorage.setItem(BED_KEY,String(n));
    value.textContent=pctText(n);
    primeMixer();
    applyGainLive();
  };
  slider.addEventListener('pointerdown',primeMixer,{capture:true});
  slider.addEventListener('touchstart',primeMixer,{capture:true,passive:true});
  slider.addEventListener('input',update);
  slider.addEventListener('change',update);
  mute.onclick=()=>{
    slider.value='0';
    localStorage.setItem(BED_KEY,'0');
    value.textContent='0%';
    primeMixer();
    applyGainLive();
  };
}

function addMixerGestureHooks(d){
  if(d.documentElement.dataset.sbrMixerHooks)return;
  d.documentElement.dataset.sbrMixerHooks='1';
  d.addEventListener('pointerdown',primeMixer,true);
  d.addEventListener('touchstart',primeMixer,{capture:true,passive:true});
}

function applyProductionUI(){
  const d=findControlDoc();
  if(!d)return false;
  lockProductionBrand(d);
  const ai=d.getElementById('v19AiEnhance');
  if(ai)ai.remove();

  if(!d.getElementById('prodLayoutStyle')){
    const st=d.createElement('style');
    st.id='prodLayoutStyle';
    st.textContent=`
      .top.prodCompact{grid-template-columns:auto 1fr auto!important;padding:6px 9px!important}
      .top.prodCompact .nowbar{display:none!important}
      .top.prodCompact .brand img{width:36px!important;height:36px!important}
      .top.prodCompact .brand h1{font-size:13px!important}
      .top.prodCompact .brand .mut{font-size:9px!important}
      .prodBedVolume{display:grid;grid-template-columns:auto minmax(140px,1fr) 64px auto;gap:9px;align-items:center;margin-top:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0a0f15}
      .prodBedLabel{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
      .prodBedLabel b{font-size:10px;letter-spacing:.08em;color:var(--cyan)}
      .prodBedLabel span{font-size:8px;color:var(--mut)}
      .prodBedVolume input[type=range]{width:100%;accent-color:var(--cyan);min-height:34px}
      .prodBedValue{font-size:12px;font-weight:950;text-align:right;font-variant-numeric:tabular-nums}
      @media(max-width:1050px){
        .top,.nav{position:static!important;top:auto!important}
        .nav{background:transparent!important;padding-bottom:7px!important}
        .top.prodCompact{grid-template-columns:1fr auto!important}
        .top.prodCompact .brand{min-width:0}
        .top.prodCompact .row{justify-content:flex-end}
      }
      @media(max-width:620px){
        .top.prodCompact{grid-template-columns:1fr!important}
        .top.prodCompact .row{justify-content:flex-start}
        .top.prodCompact .brand img{width:34px!important;height:34px!important}
        .top.prodCompact .brand h1{font-size:12px!important}
        .prodBedVolume{grid-template-columns:minmax(0,1fr) 66px;gap:5px 8px}
        .prodBedLabel{grid-column:1/-1}
        .prodBedVolume input[type=range]{grid-column:1/2}
        #prodBedMute{grid-column:1/-1;width:100%}
      }
    `;
    d.head.appendChild(st);
  }

  const top=d.querySelector('.top');
  if(top&&!d.getElementById('prodHeaderToggle')){
    const btn=d.createElement('button');
    btn.id='prodHeaderToggle';
    btn.className='mini';
    btn.textContent='⌃ HEADER';
    btn.style.whiteSpace='nowrap';
    const actionRow=top.lastElementChild;
    if(actionRow)actionRow.prepend(btn);
    btn.onclick=()=>{
      const compact=top.classList.toggle('prodCompact');
      btn.textContent=compact?'⌄ HEADER':'⌃ HEADER';
    };
  }

  addBedSlider(d);
  addMixerGestureHooks(d);
  patchNewswireFade();
  document.title='Silver Bull Radio W3BC — Bullpen Control Room';
  return true;
}

loadFavicon();
board.addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(applyProductionUI()||tries>120){
      clearInterval(timer);
      boot.classList.add('hide');
    }
  },100);
});

setInterval(()=>{
  if(!mixerPrimed)return;
  discoverBeds();
  patchNewswireFade();
  BED_GRAPHS.forEach(g=>{try{if(g.audio.volume!==1)g.audio.volume=1}catch(e){}});
},150);
</script>
<script src="live-news-overlay.js?v=20260812-0825"></script>
<script src="room-reset-v20.js?v=20260812-0825"></script>
<script src="newswire-direct-v21.js?v=20260812-0825"></script>
</body>
</html>
