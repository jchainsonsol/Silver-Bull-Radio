<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090c"><title>Silver Bull Radio — V11 Preview</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090c;color:#f5f7fa;font-family:system-ui}.box{width:min(560px,90vw);padding:26px;border:1px solid #302645;border-radius:18px;background:#10141a;text-align:center}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:#b69cff}.bar{height:8px;border-radius:999px;background:#222a34;overflow:hidden;margin:18px 0}.fill{height:100%;width:18%;background:linear-gradient(90deg,#8b5cf6,#34d7ff);animation:load 1.1s ease-in-out infinite alternate}.sub{color:#97a3b2;font-size:13px}.err{color:#ff9aa5;white-space:pre-wrap;text-align:left;font-family:ui-monospace,monospace;font-size:12px}@keyframes load{to{width:90%}}</style></head>
<body><div class="box" id="box"><div class="brand">SILVER BULL RADIO <span>W3BC</span></div><div class="bar"><div class="fill"></div></div><div class="sub" id="status">Loading V11 control board…</div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser does not support the preview loader. Use current Chrome, Edge, or Safari.');const r=await fetch('data/app/v11.gz.b64',{cache:'no-store'});if(!r.ok)throw new Error('V11 payload returned HTTP '+r.status);const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('Hourly News Planner')||!html.includes('X Post Desk')||!html.includes('Silver Bull Newswire'))throw new Error('V11 payload integrity check failed.');document.open();document.write(html);document.close()}catch(err){document.getElementById('box').innerHTML='<div class="brand">V11 PREVIEW <span>LOAD ERROR</span></div><p class="sub">The live homepage was not changed.</p><div class="err">'+String(err&&err.message?err.message:err)+'</div>'}})();</script></body></html>
