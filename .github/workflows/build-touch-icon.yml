name: Build Silver Bull Home Screen Icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-touch-icon.yml'
      - 'assets/silver-bull-radio-logo.b64'

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Apple touch icon and web app icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          raw = base64.b64decode(Path('assets/silver-bull-radio-logo.b64').read_text().strip())
          img = Image.open(BytesIO(raw)).convert('RGB')

          # Crop to a clean square from center, then produce iOS/PWA sizes.
          w, h = img.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          img = img.crop((left, top, left + side, top + side))

          for size, path in [
              (180, 'apple-touch-icon.png'),
              (192, 'assets/icon-192.png'),
              (512, 'assets/icon-512.png'),
          ]:
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(path, 'PNG', optimize=True)
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || git commit -m "Add Silver Bull home screen app icons"
          git push
