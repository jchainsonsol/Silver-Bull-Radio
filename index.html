<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>Silver Bull Radio W3BC — Live Control Board</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}#board{border:0;width:100%;height:100%;display:block;background:#07090c}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#07090c;color:#c9b8ff;font:800 15px system-ui;z-index:5}.boot.hide{display:none}
</style>
</head>
<body>
<div id="boot" class="boot">Loading Silver Bull Radio W3BC…</div>
<iframe id="board" src="preview-v11.html?live=20260810-0728" title="Silver Bull Radio Live Control Board"></iframe>
<script>
const frame=document.getElementById('board');
const boot=document.getElementById('boot');
const SPACE='https://x.com/i/spaces/1nGnRBYnkjNGO';
async function getText(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.text()}
frame.addEventListener('load',async()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  try{
    // Real Silver Bull Radio branding.
    const logo64=(await getText('assets/silver-bull-radio-logo.b64')).trim();
    const bull=d.querySelector('.bull');
    if(bull){
      const img=d.createElement('img');
      img.src='data:image/webp;base64,'+logo64;
      img.alt='Silver Bull Radio W3BC';
      img.style.cssText='width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid rgba(201,184,255,.65);box-shadow:0 0 24px rgba(156,108,255,.22);display:block';
      bull.replaceWith(img);
    }
    const brandSmall=d.querySelector('.brand small');
    if(brandSmall)brandSmall.textContent='Welcome to the Bullpen · LAUNCH DAY LIVE CONTROL BOARD';

    // Add the host's full post-opener Morning Briefing directly beside live controls.
    const rightStack=d.querySelector('.main')?.children?.[1];
    const liveAutomation=rightStack?.children?.[0];
    if(rightStack&&liveAutomation){
      const briefing=d.createElement('section');
      briefing.className='panel newswire';
      briefing.id='morningBriefingPanel';
      briefing.innerHTML=`<div class="head"><h2>Morning Briefing — Your Read</h2><span class="sub">Opening song → Sunset Gate → this script</span></div><div class="body"><textarea id="morningBriefing" style="min-height:240px" placeholder="Loading today's briefing…"></textarea><div class="row" style="margin-top:7px"><button id="briefBedOn" class="btn purple">START SUNSET GATE BED</button><button id="briefBedOff" class="btn sm">BED OFF</button><button id="briefDone" class="btn primary">BRIEFING DONE → AUTOMATED OPEN</button></div><div class="newsStatus">GO LIVE plays the opener. When it ends, the bed starts and this becomes your live script.</div></div>`;
      rightStack.insertBefore(briefing,liveAutomation.nextSibling);
      d.getElementById('morningBriefing').value=await getText('data/opening-monologue.txt');
      d.getElementById('briefBedOn').onclick=()=>d.getElementById('bedOn')?.click();
      d.getElementById('briefBedOff').onclick=()=>d.getElementById('bedOff')?.click();
      d.getElementById('briefDone').onclick=()=>{d.getElementById('bedOff')?.click();d.getElementById('startAuto')?.scrollIntoView({behavior:'smooth',block:'center'});};
    }

    // Newswire is manual for launch day. Load the full read automatically.
    const newsScript=d.getElementById('newsScript');
    if(newsScript)newsScript.value=await getText('data/newswire-today.txt');
    const newsHead=d.querySelector('.newswire .head .sub');
    if(newsHead)newsHead.textContent='LIVE SCRIPT · you read it';
    const playNews=d.getElementById('playNews');
    if(playNews){
      playNews.textContent='READ NEWSWIRE SCRIPT';
      playNews.onclick=()=>{newsScript?.scrollIntoView({behavior:'smooth',block:'center'});newsScript?.focus();};
    }
    const newsStatus=d.getElementById('newsStatus');
    if(newsStatus)newsStatus.textContent='Manual launch-day mode. Read the script, then hit NEWSWIRE DONE → PLAY ID 2.';

    // Replace the old Newswire audio pad with a script jump.
    [...d.querySelectorAll('.sound')].forEach(btn=>{
      if((btn.textContent||'').toUpperCase().includes('NEWSWIRE')){
        btn.removeAttribute('data-path');
        btn.innerHTML='<b>NEWSWIRE SCRIPT</b><span>Jump to your live read</span>';
        btn.onclick=()=>{newsScript?.scrollIntoView({behavior:'smooth',block:'center'});newsScript?.focus();};
      }
    });

    // Manual handoff button after the Newswire read.
    if(newsScript&&!d.getElementById('newswireDone')){
      const row=playNews?.parentElement;
      const done=d.createElement('button');
      done.id='newswireDone';done.className='btn green';done.textContent='NEWSWIRE DONE → PLAY ID 2';
      done.onclick=()=>{
        if(typeof w.play==='function')w.play('audio/station-id-2.mp3','Station ID 2',()=>{
          const lt=d.getElementById('liveType'),ttl=d.getElementById('liveTitle'),meta=d.getElementById('liveMeta');
          if(lt)lt.textContent='YOUR MIC';if(ttl)ttl.textContent='Open Panel / Focus Interview';if(meta)meta.textContent='Station ID 2 complete — take the room live.';
        });
      };
      row?.appendChild(done);
    }

    // GO LIVE = opener, then automatically bring Sunset Gate up and put the Morning Briefing in front of the host.
    const goLive=d.getElementById('goLive');
    if(goLive){
      goLive.onclick=()=>{
        const pill=d.getElementById('livePill');if(pill){pill.classList.add('live');pill.textContent='● LIVE';}
        if(typeof w.setX==='function'&&typeof w.livePost==='function')w.setX(w.livePost());
        if(typeof w.play==='function')w.play('audio/welcome-to-the-bullpen.mp3','Welcome to the Bullpen',()=>{
          d.getElementById('bedOn')?.click();
          const lt=d.getElementById('liveType'),ttl=d.getElementById('liveTitle'),meta=d.getElementById('liveMeta');
          if(lt)lt.textContent='YOUR MIC';if(ttl)ttl.textContent='Monday Morning Briefing';if(meta)meta.textContent='Sunset Gate is up — deliver the full morning briefing.';
          d.getElementById('morningBriefingPanel')?.scrollIntoView({behavior:'smooth',block:'start'});
        });
      };
    }

    // Launch-day automated open: one song -> ID 1 -> STOP for manual Newswire read.
    const startAuto=d.getElementById('startAuto'),autoStatus=d.getElementById('autoStatus');
    if(startAuto){
      startAuto.textContent='START SONG → ID 1 → NEWSWIRE';
      startAuto.onclick=async()=>{
        d.getElementById('bedOff')?.click();
        if(autoStatus)autoStatus.textContent='Starting song… then Station ID 1…';
        try{
          const catalog=JSON.parse(await getText('data/music.json'));
          const items=catalog.items||[];
          const track=items[Math.floor(Math.random()*items.length)];
          if(!track||typeof w.play!=='function')throw new Error('Music catalog unavailable');
          w.play(track.file,track.title,()=>{
            if(autoStatus)autoStatus.textContent='Song complete. Playing Station ID 1…';
            w.play('audio/station-id-1.mp3','Station ID 1',()=>{
              if(autoStatus)autoStatus.textContent='STATION ID 1 COMPLETE — READ NEWSWIRE NOW.';
              newsScript?.scrollIntoView({behavior:'smooth',block:'center'});newsScript?.focus();
              const spans=d.querySelectorAll('#autoFlow span');spans.forEach(x=>x.classList.remove('active'));if(spans[2])spans[2].classList.add('active');
            });
          });
        }catch(e){if(autoStatus)autoStatus.textContent='Could not start automated open: '+e.message;}
      };
    }

    // Production label cleanup.
    const autoFlow=[...d.querySelectorAll('#autoFlow span')];
    if(autoFlow[2])autoFlow[2].textContent='YOU READ NEWSWIRE';
    if(autoStatus)autoStatus.textContent='Launch flow: song → ID 1 → you read Newswire → NEWSWIRE DONE plays ID 2 → your mic.';
    const footer=d.querySelector('.footer span:last-child');if(footer)footer.textContent='LAUNCH DAY · Manual-first production mode';
  }catch(err){console.error('Launch patch error',err);}
  boot.classList.add('hide');
});
</script>
</body>
</html>
