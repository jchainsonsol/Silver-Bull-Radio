<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Bull Radio W3BC — V18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}#shell{border:0;width:100%;height:100%;display:block;background:#07090c}</style></head><body><iframe id="shell" src="preview-v17.html?v=v18" title="Silver Bull Radio"></iframe><script>
const shell=document.getElementById('shell');
let liveCfg={space:'https://x.com/i/spaces/1dxYlajZBNEJX',x_group:'https://x.com/i/chat/group_join/g2074658589738705113/VUKM5PsWPp',discord:'https://discord.gg/72mX4EGpS7',telegram:'https://t.me/JCHAINStheSilverBull',jchains_ca:'5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump'};
const DEFAULT_SCHEDULE={
'9':[ {type:'SHOW OPEN',title:'Show Open + Morning Setup',min:10},{type:'NEWSWIRE',title:'Silver Bull Newswire',min:5},{type:'OPEN PANEL',title:'Open Panel',min:20},{type:'MUSIC RUN',title:'Music Reset',min:15},{type:'OPEN PANEL',title:'Open Panel',min:10}],
'10':[ {type:'HOURLY BRIEF',title:'10 AM Reset',min:5},{type:'GM GET MONEY',title:'GM Get Money',min:25},{type:'MUSIC RUN',title:'Music Reset',min:15},{type:'OPEN PANEL',title:'Open Panel',min:15}],
'11':[ {type:'HOURLY BRIEF',title:'11 AM Reset',min:5},{type:'FOCUS',title:'Tokenization + RWA',min:30},{type:'MUSIC RUN',title:'Music Reset',min:15},{type:'OPEN PANEL',title:'Open Panel',min:10}],
'12':[ {type:'HOURLY BRIEF',title:'12 PM Reset',min:5},{type:'FOCUS',title:'Onchain Finance',min:25},{type:'MUSIC RUN',title:'Music Reset',min:15},{type:'OPEN PANEL',title:'Final Open Panel',min:10},{type:'CLOSE',title:'Bullpen Close',min:5}]};
function fmt(s){if(!Number.isFinite(s)||s<0)return'--:--';s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function getSchedule(){try{return JSON.parse(localStorage.getItem('sbr17schedule'))||DEFAULT_SCHEDULE}catch(e){return DEFAULT_SCHEDULE}}
async function loadCfg(){try{const r=await fetch('data/live-config.json?v='+Date.now(),{cache:'no-store'});if(r.ok)liveCfg={...liveCfg,...await r.json()}}catch(e){}}
function getDocs(){try{const v17w=shell.contentWindow,v17d=shell.contentDocument,inner=v17d.getElementById('board');if(!inner||!inner.contentDocument)return{};return{v17w,v17d,inner,doc:inner.contentDocument,win:inner.contentWindow}}catch(e){return{}}}
function injectStyle(doc){if(doc.getElementById('sbr18style'))return;const st=doc.createElement('style');st.id='sbr18style';st.textContent=`#sbr18Ops .body{padding:9px}.s18grid{display:grid;grid-template-columns:.75fr 1.6fr 1fr .8fr;gap:7px}.s18card{background:#0a0f15;border:1px solid var(--line);border-radius:10px;padding:8px}.s18label{font-size:8px;color:var(--mut);font-weight:900;letter-spacing:.09em}.s18big{font-size:17px;font-weight:950;margin-top:2px}.s18sub{font-size:9px;color:var(--mut);margin-top:3px;line-height:1.35}.s18next{display:grid;gap:3px;margin-top:4px}.s18next div{font-size:9px;padding:3px 5px;border-radius:6px;background:#101721;border:1px solid #25313d}.s18good{color:var(--green)}.s18cyan{color:var(--cyan)}@media(max-width:900px){.s18grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.s18grid{grid-template-columns:1fr}}`;doc.head.appendChild(st)}
function selectedHour(doc){const sel=doc.getElementById('briefHour');return sel?sel.value:'9'}
function hourLabel(h){return h==='9'?'9–10 AM':h==='10'?'10–11 AM':h==='11'?'11 AM–12 PM':'12–1 PM'}
function renderOps(doc){const old=[...doc.querySelectorAll('#control .panel')].find(p=>(p.querySelector('.head h2')?.textContent||'').toUpperCase().includes('NOW PLAYING / NOW HAPPENING'));if(!old)return;old.id='sbr18Ops';old.querySelector('.head h2').textContent='Live Operations';const sub=old.querySelector('.head .mut');if(sub)sub.textContent='hour · next blocks · automation · show clock';old.querySelector('.body').innerHTML=`<div class="s18grid"><div class="s18card"><div class="s18label">CURRENT HOUR</div><div class="s18big" id="s18Hour">9–10 AM</div><div class="s18sub" id="s18HourUse">60 / 60 min planned</div></div><div class="s18card"><div class="s18label">NEXT 3 BLOCKS</div><div class="s18next" id="s18Next"></div></div><div class="s18card"><div class="s18label">AUDIO / AUTOMATION</div><div class="s18big s18good" id="s18Audio">READY</div><div class="s18sub" id="s18Chain">One tap actions · ID every 2 songs</div></div><div class="s18card"><div class="s18label">SHOW CLOCK</div><div class="s18big" id="s18Clock">9:00–1:00</div><div class="s18sub" id="s18ClockSub">4 hour broadcast</div></div></div>`;updateOps(doc)}
function updateOps(doc){const h=selectedHour(doc),s=getSchedule(),blocks=s[h]||[],mins=blocks.reduce((a,b)=>a+(+b.min||0),0);const hEl=doc.getElementById('s18Hour'),u=doc.getElementById('s18HourUse'),n=doc.getElementById('s18Next');if(hEl)hEl.textContent=hourLabel(h);if(u)u.textContent=`${mins} / 60 min planned${mins===60?' ✓':mins<60?` · ${60-mins} open`:` · ${mins-60} over`}`;if(n)n.innerHTML=blocks.slice(0,3).map((b,i)=>`<div>${i+1}. ${b.title} · ${b.min}m</div>`).join('')||'<div>No blocks loaded</div>';const now=new Date(),hour=now.getHours(),min=now.getMinutes();const clock=doc.getElementById('s18ClockSub');if(clock){if(hour>=9&&hour<13){const rem=(13*60)-(hour*60+min);clock.textContent=`${Math.floor(rem/60)}h ${rem%60}m until 1 PM`}else clock.textContent='4 hour broadcast · 9 AM–1 PM'}}
function patchLinks(doc){const open=[...doc.querySelectorAll('a')].find(a=>(a.textContent||'').includes('OPEN X'));if(open)open.href=liveCfg.space;const ta=doc.getElementById('xText'),list=doc.querySelector('#social .templateList');if(!ta||!list)return;const posts={live:`Silver Bull Radio is LIVE on W3BC.\n\nWelcome to the Bullpen. Markets, crypto, tokenization, music and the conversations that matter.\n\n${liveCfg.space}`,next:`NEXT UP on Silver Bull Radio W3BC:\n\n[ADD NEXT TOPIC]\n\nJump into the Bullpen: ${liveCfg.space}`,repost:`If you're listening to Silver Bull Radio, hit the purple pill, repost the Space and tag somebody who belongs in the Bullpen.\n\n${liveCfg.space}`,xgroup:`Stay in the conversation after the mic turns off. Join the Silver Bull X Group:\n\n${liveCfg.x_group}`,discord:`The Bullpen keeps moving after the show. Join us on Discord:\n\n${liveCfg.discord}`,telegram:`Join the $JCHAINS community on Telegram:\n\n${liveCfg.telegram}`,jchains:`$JCHAINS is the community token powering the Silver Bull ecosystem.\n\nCA: ${liveCfg.jchains_ca}\n\nTelegram: ${liveCfg.telegram}`,midshow:`Silver Bull Radio mid-show reset:\n\nWe've covered [TOPIC 1], [TOPIC 2] and [TOPIC 3]. Still ahead: [WHAT'S NEXT].\n\nAppreciate everyone hanging in the Bullpen with us.`,thanks:`That's a wrap on Silver Bull Radio W3BC for today.\n\nHuge thank you to everyone who listened, spoke, reposted and helped us build day by day.\n\nWe'll take what worked, fix what didn't and come back 1% better tomorrow.\n\nWelcome to the Bullpen.`};list.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>ta.value=posts[b.dataset.p]||'');const add=doc.getElementById('addSpace');if(add)add.onclick=()=>{if(!ta.value.includes(liveCfg.space))ta.value+=(ta.value?'\n\n':'')+liveCfg.space}}
function audioState(){const {v17d,doc}=getDocs();if(!v17d||!doc)return null;const nw=v17d.getElementById('nwVoice'),id2=v17d.getElementById('nwId2'),fx=doc.getElementById('fx');if(nw&&!nw.paused&&!nw.ended&&Number.isFinite(nw.duration))return{title:'Silver Bull Newswire',sub:'Automated voice + 5% bed',left:nw.duration-nw.currentTime,kind:'NEWSWIRE',pct:nw.currentTime/nw.duration*100};if(id2&&!id2.paused&&!id2.ended&&Number.isFinite(id2.duration))return{title:'Station ID 2',sub:'Newswire handoff',left:id2.duration-id2.currentTime,kind:'STATION ID',pct:id2.currentTime/id2.duration*100};if(fx&&!fx.paused&&!fx.ended&&Number.isFinite(fx.duration)){const src=(fx.currentSrc||'').toLowerCase();if(src.includes('station-id'))return{title:src.includes('station-id-2')?'Station ID 2':'Station ID 1',sub:'Manual station ID',left:fx.duration-fx.currentTime,kind:'STATION ID',pct:fx.currentTime/fx.duration*100}}return null}
function tick(){const {doc}=getDocs();if(!doc)return;const a=audioState();if(a){if(doc.getElementById('nowTitle'))doc.getElementById('nowTitle').textContent=a.title;if(doc.getElementById('nowSub'))doc.getElementById('nowSub').textContent=a.sub;if(doc.getElementById('nowLeft'))doc.getElementById('nowLeft').textContent=fmt(a.left);if(doc.getElementById('nowKind'))doc.getElementById('nowKind').textContent=a.kind;const au=doc.getElementById('s18Audio'),ch=doc.getElementById('s18Chain');if(au){au.textContent=fmt(a.left)+' LEFT';au.className='s18big s18cyan'}if(ch)ch.textContent=`${a.title} · ${a.sub}`;}else{const au=doc.getElementById('s18Audio'),ch=doc.getElementById('s18Chain');if(au){au.textContent='READY';au.className='s18big s18good'}if(ch)ch.textContent='One tap actions · ID every 2 songs'}updateOps(doc)}
async function patch(){await loadCfg();const wait=()=>{const {doc}=getDocs();if(!doc||!doc.getElementById('control'))return setTimeout(wait,100);injectStyle(doc);const brand=doc.querySelector('.brand .mut');if(brand)brand.textContent='Hybrid Control Panel · V18 Preview';renderOps(doc);patchLinks(doc);const hour=doc.getElementById('briefHour');if(hour)hour.onchange=()=>updateOps(doc);setInterval(tick,250)};wait()}
shell.addEventListener('load',patch);
</script></body></html>
