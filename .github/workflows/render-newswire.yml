name: Render Silver Bull Newswire

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: ElevenLabs voice ID
        required: true
        default: 'kPzsL2i3teMYv0FxEYQ6'
        type: string
  push:
    branches: [main]
    paths:
      - 'data/newswire-today.txt'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      VOICE_ID: ${{ github.event.inputs.voice_id || 'kPzsL2i3teMYv0FxEYQ6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ElevenLabs API key
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Missing GitHub repository secret ELEVENLABS_API_KEY"
            exit 1
          fi
          echo "ElevenLabs API key secret is present."

      - name: Render Newswire MP3 with ElevenLabs
        shell: bash
        run: |
          mkdir -p audio/news
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          text = Path('data/newswire-today.txt').read_text(encoding='utf-8').strip()
          if not text:
              raise SystemExit('Newswire script is empty.')

          payload = {
              'text': text,
              'model_id': 'eleven_multilingual_v2'
          }

          voice_id = os.environ['VOICE_ID']
          url = f'https://api.elevenlabs.io/v1/text-to-speech/{voice_id}?output_format=mp3_44100_128'
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'xi-api-key': os.environ['ELEVENLABS_API_KEY'],
                  'Content-Type': 'application/json',
                  'Accept': 'audio/mpeg',
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=180) as r:
                  audio = r.read()
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              print(f'::error::ElevenLabs HTTP {e.code}: {body}')
              raise SystemExit(1)
          except Exception as e:
              print(f'::error::ElevenLabs request failed: {e}')
              raise SystemExit(1)

          if len(audio) < 1000:
              print(f'::error::ElevenLabs returned an unexpectedly small audio file: {len(audio)} bytes')
              raise SystemExit(1)

          Path('audio/news/today.mp3').write_bytes(audio)
          print(f'Rendered {len(audio):,} bytes with ElevenLabs voice {voice_id}.')
          PY

      - name: Verify output
        run: |
          test -s audio/news/today.mp3
          ls -lh audio/news/today.mp3

      - name: Commit rendered audio
        shell: bash
        run: |
          git config user.name "Silver Bull Radio Newswire"
          git config user.email "actions@users.noreply.github.com"
          git add audio/news/today.mp3
          if git diff --cached --quiet; then
            echo "Newswire audio unchanged."
            exit 0
          fi
          git commit -m "Render Silver Bull Newswire audio via ElevenLabs"
          git push
