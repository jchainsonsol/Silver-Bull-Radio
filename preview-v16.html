<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Bull Radio W3BC — V16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}#board{border:0;width:100%;height:100%;display:block;background:#07090c}</style></head><body><iframe id="board" src="preview-v13.html?v=v16" title="Silver Bull Radio"></iframe><audio id="nwVoice" preload="metadata"></audio><audio id="nwBed" preload="auto"></audio><audio id="nwId2" preload="auto"></audio><script>
const frame=document.getElementById('board'),voice=document.getElementById('nwVoice'),bed=document.getElementById('nwBed'),id2=document.getElementById('nwId2');
let cfg={audio:'audio/newswire-today.MP3',bed:'audio/beds/sunset-gate.mp3',handoff:'audio/station-id-2.mp3',bed_level:.10,voice_level:1,auto_station_id:true},running=false;
function fmt(s){if(!Number.isFinite(s)||s<0)return'--:--';s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fade(a,to,ms,cb){const from=a.volume,start=performance.now();function f(n){const p=Math.min(1,(n-start)/ms);a.volume=from+(to-from)*p;if(p<1)requestAnimationFrame(f);else cb&&cb()}requestAnimationFrame(f)}
function ui(mode,title,meta){try{const d=frame.contentDocument;const m=d.getElementById('nowMode'),t=d.getElementById('nowTitle'),x=d.getElementById('nowMeta');if(m)m.textContent=mode;if(t)t.textContent=title;if(x)x.textContent=meta}catch(e){}}
async function init(){try{const r=await fetch('data/newswire-meta.json?v='+Date.now(),{cache:'no-store'});if(r.ok)cfg={...cfg,...await r.json()}}catch(e){}voice.src=cfg.audio+'?v='+Date.now();bed.src=cfg.bed;id2.src=cfg.handoff;voice.volume=cfg.voice_level||1;}
async function playNewswire(){if(running)return;running=true;try{voice.pause();bed.pause();id2.pause();voice.currentTime=0;bed.currentTime=0;id2.currentTime=0;bed.volume=0;voice.volume=cfg.voice_level||1;await bed.play();fade(bed,cfg.bed_level||.10,700);setTimeout(()=>voice.play().catch(e=>{ui('ERROR','Newswire failed',e.message);running=false}),220);ui('NEWSWIRE','Silver Bull Newswire','Starting daily Newswire package…')}catch(e){ui('ERROR','Newswire failed',e.message);running=false}}
voice.ontimeupdate=()=>{if(!running)return;const left=(voice.duration||0)-(voice.currentTime||0);ui('NEWSWIRE','Silver Bull Newswire',`${fmt(left)} remaining · voice + Sunset Gate bed`)};
voice.onended=async()=>{if(!running)return;ui('STATION ID','Station ID 2','Newswire complete — station handoff.');if(cfg.auto_station_id!==false){bed.volume=Math.min(cfg.bed_level||.10,.06);try{await id2.play()}catch(e){fade(bed,0,1000,()=>bed.pause());running=false;ui('MIC','JChains','Newswire complete — take the room live.')}}else{fade(bed,0,1000,()=>bed.pause());running=false;ui('MIC','JChains','Newswire complete — take the room live.')}};
id2.onended=()=>fade(bed,0,1300,()=>{bed.pause();bed.currentTime=0;running=false;ui('MIC','JChains','Newswire complete — take the room live.')});
function stopNewswire(){running=false;[voice,bed,id2].forEach(a=>{a.pause();try{a.currentTime=0}catch(e){}});ui('MIC','JChains','Manual control.');}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const b=d.getElementById('newswireBtn');if(b){b.textContent='NEWSWIRE';b.onclick=playNewswire;const s=b.querySelector('span');if(s)s.textContent='One tap · voice + bed + ID 2';}const stop=d.getElementById('stopAll');if(stop){const old=stop.onclick;stop.onclick=e=>{stopNewswire();if(typeof old==='function')old.call(stop,e)}}}catch(e){console.error(e)}});
init();
</script></body></html>
