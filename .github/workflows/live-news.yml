name: Silver Bull Live News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: silver-bull-live-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect recent headlines
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          queries = [
              'bitcoin crypto ETF SEC regulation',
              'tokenization tokenized securities RWA blockchain',
              'stablecoin on-chain finance DeFi institutional crypto',
              'Solana Ethereum Chainlink crypto markets'
          ]

          items = []
          seen = set()

          for query in queries:
              url = 'https://news.google.com/rss/search?q=' + urllib.parse.quote(query) + '&hl=en-US&gl=US&ceid=US:en'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'SilverBullRadio/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())
              except Exception as exc:
                  print('feed error:', query, exc)
                  continue

              for node in root.findall('./channel/item')[:15]:
                  title = (node.findtext('title') or '').strip()
                  link = (node.findtext('link') or '').strip()
                  pub = (node.findtext('pubDate') or '').strip()
                  source_node = node.find('source')
                  source = (source_node.text or '').strip() if source_node is not None else 'Google News'
                  if not title or not link:
                      continue
                  key = title.lower()
                  if key in seen:
                      continue
                  seen.add(key)
                  try:
                      dt = parsedate_to_datetime(pub)
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      iso = dt.astimezone(timezone.utc).isoformat()
                      ts = dt.timestamp()
                  except Exception:
                      iso = ''
                      ts = 0
                  items.append({'headline':title,'source':source,'url':link,'published':iso,'_ts':ts})

          items.sort(key=lambda x:x['_ts'], reverse=True)
          items = items[:40]
          for item in items:
              item.pop('_ts', None)

          payload = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'refresh_minutes': 5,
              'items': items
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/live-news.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print('saved', len(items), 'headlines')
          PY

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-news.json
          git diff --cached --quiet || git commit -m "Refresh live Silver Bull news"
          git push
