<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Bull Radio W3BC — V15</title><style>:root{--bg:#07090c;--panel:#0b1118;--line:#2b3948;--txt:#f7f8fb;--mut:#95a0af;--pur:#9c6cff;--cyan:#39d8ff;--green:#65ff9a;--red:#ff6676}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--txt)}#board{position:absolute;inset:0;border:0;width:100%;height:100%}#nwDock{position:fixed;left:14px;right:14px;bottom:14px;z-index:9999;background:rgba(8,12,18,.97);border:1px solid rgba(156,108,255,.6);border-radius:15px;padding:10px 12px;box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:12px;font-weight:950;letter-spacing:.08em}.sub,.status{font-size:10px;color:var(--mut)}.grid{display:grid;grid-template-columns:1.4fr .7fr 1.5fr;gap:9px;align-items:center;margin-top:8px}.card{background:#0a0f15;border:1px solid var(--line);border-radius:10px;padding:8px}.label{font-size:9px;color:var(--mut);font-weight:900}.name{font-size:15px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:30px;font-weight:950}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:#121b26;color:var(--txt);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}.btn.green{border-color:var(--green);color:var(--green)}.btn.red{border-color:var(--red);color:#ff9da7}.btn.pur{border-color:var(--pur);color:#cfbfff}.meter{height:6px;background:#222b35;border-radius:999px;overflow:hidden;margin-top:6px}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--pur),var(--cyan))}.mini{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}.control{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.control label{font-size:9px;color:var(--mut)}input[type=range]{width:100%}#fallback{display:none;margin-top:7px}.file{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}#nwDock{left:7px;right:7px;bottom:7px}.time{font-size:24px}}</style></head><body><iframe id="board" src="preview-v13.html?v=v15" title="Silver Bull Radio"></iframe><div id="nwDock"><div class="top"><div><div class="title">DAILY NEWSWIRE PACKAGE</div><div class="sub" id="dateLabel">Loading today’s Newswire configuration…</div></div><button id="collapse" class="mini">⌄</button></div><div id="dockBody" class="grid"><div class="card"><div class="label">READY / NOW PLAYING</div><div class="name" id="nwName">Checking audio/newswire-today.mp3…</div><div class="meter"><div id="progress"></div></div><div class="status" id="status">Checking daily audio…</div><div id="fallback"><label for="fileInput" class="btn pur">TEST WITH LOCAL MP3</label><input id="fileInput" class="file" type="file" accept="audio/*"></div></div><div class="card"><div class="label">TIME REMAINING</div><div class="time" id="remaining">--:--</div><div class="sub"><span id="elapsed">00:00</span> elapsed</div></div><div class="card"><div class="row"><button id="play" class="btn green">PLAY NEWSWIRE + BED</button><button id="pause" class="btn">PAUSE</button><button id="stop" class="btn red">STOP</button></div><div class="control"><div><label>BED LEVEL <b id="bedVal">10%</b></label><input id="bedLevel" type="range" min="2" max="20" value="10"></div><div><label>VOICE LEVEL <b id="voiceVal">100%</b></label><input id="voiceLevel" type="range" min="70" max="100" value="100"></div></div><div class="sub" style="margin-top:5px">Newswire → Station ID 2 → back to mic</div></div></div></div><audio id="voice" preload="metadata"></audio><audio id="bed" preload="auto"></audio><audio id="handoff" preload="auto"></audio><script>const $=s=>document.querySelector(s);const frame=$('#board'),voice=$('#voice'),bed=$('#bed'),handoff=$('#handoff');let cfg={audio:'audio/newswire-today.mp3',bed:'audio/beds/sunset-gate.mp3',handoff:'audio/station-id-2.mp3',bed_level:.10,voice_level:1,auto_station_id:true};let localUrl=null,finished=false;function fmt(s){if(!Number.isFinite(s)||s<0)return'--:--';s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function st(t){$('#status').textContent=t}function fade(a,to,ms,cb){const from=a.volume,start=performance.now();function f(n){const p=Math.min(1,(n-start)/ms);a.volume=from+(to-from)*p;if(p<1)requestAnimationFrame(f);else cb&&cb()}requestAnimationFrame(f)}function update(){const d=voice.duration||0,c=voice.currentTime||0;$('#elapsed').textContent=fmt(c);$('#remaining').textContent=fmt(d-c);$('#progress').style.width=(d?Math.min(100,c/d*100):0)+'%'}async function init(){try{const r=await fetch('data/newswire-meta.json?v='+Date.now(),{cache:'no-store'});if(r.ok)cfg={...cfg,...await r.json()}}catch(e){}$('#dateLabel').textContent=(cfg.label||'Today’s Newswire')+' · fixed daily file';bed.src=cfg.bed;handoff.src=cfg.handoff;voice.volume=cfg.voice_level;$('#voiceLevel').value=Math.round(cfg.voice_level*100);$('#bedLevel').value=Math.round(cfg.bed_level*100);$('#voiceVal').textContent=Math.round(cfg.voice_level*100)+'%';$('#bedVal').textContent=Math.round(cfg.bed_level*100)+'%';voice.src=cfg.audio+'?v='+Date.now();voice.load();const test=new Audio();test.preload='metadata';test.src=cfg.audio+'?probe='+Date.now();test.onloadedmetadata=()=>{$('#nwName').textContent=cfg.label||'Today’s Newswire';st('Daily Newswire loaded automatically — ready.');$('#fallback').style.display='none'};test.onerror=()=>{$('#nwName').textContent='Daily file not found';st('Upload newswire-today.mp3 to the repo audio folder for automatic playback.');$('#fallback').style.display='block'}}init();async function playPackage(){if(!voice.src){st('No Newswire audio loaded.');return}finished=false;voice.currentTime=0;bed.currentTime=0;bed.volume=0;voice.volume=+$('#voiceLevel').value/100;try{await bed.play();fade(bed,+$('#bedLevel').value/100,800);setTimeout(()=>voice.play().catch(e=>st('Voice failed: '+e.message)),250);st('ON AIR — Newswire package running.');updateInner('NEWSWIRE','Silver Bull Newswire','Automated voice + bed package is on air.')}catch(e){st('Audio start failed: '+e.message)}}function updateInner(type,title,meta){try{const d=frame.contentDocument;if(d.getElementById('nowMode'))d.getElementById('nowMode').textContent=type;if(d.getElementById('nowTitle'))d.getElementById('nowTitle').textContent=title;if(d.getElementById('nowMeta'))d.getElementById('nowMeta').textContent=meta}catch(e){}}$('#play').onclick=playPackage;$('#pause').onclick=()=>{if(voice.paused){voice.play();bed.play();$('#pause').textContent='PAUSE';st('Newswire resumed.')}else{voice.pause();bed.pause();$('#pause').textContent='RESUME';st('Newswire paused.')}};$('#stop').onclick=()=>{finished=true;[voice,bed,handoff].forEach(a=>{a.pause();a.currentTime=0});$('#progress').style.width='0';$('#elapsed').textContent='00:00';$('#remaining').textContent=fmt(voice.duration);$('#pause').textContent='PAUSE';st('Newswire stopped.');updateInner('MIC','JChains','Manual control.');setTimeout(()=>finished=false,100)};$('#bedLevel').oninput=e=>{$('#bedVal').textContent=e.target.value+'%';if(!bed.paused)bed.volume=+e.target.value/100};$('#voiceLevel').oninput=e=>{$('#voiceVal').textContent=e.target.value+'%';voice.volume=+e.target.value/100};$('#fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);voice.src=localUrl;voice.load();$('#nwName').textContent=f.name;st('Local test file loaded.');};voice.ontimeupdate=update;voice.onloadedmetadata=update;voice.onended=async()=>{if(finished)return;finished=true;if(cfg.auto_station_id){st('Newswire complete — Station ID 2.');bed.volume=Math.min(+$('#bedLevel').value/100,.06);try{handoff.currentTime=0;await handoff.play();updateInner('STATION ID','Station ID 2','Newswire handoff.')}catch(e){fade(bed,0,1200,()=>bed.pause())}}else fade(bed,0,1200,()=>bed.pause())};handoff.onended=()=>fade(bed,0,1500,()=>{bed.pause();bed.currentTime=0;st('Package complete — back to your mic.');updateInner('MIC','JChains','Newswire complete — take the room live.');finished=false});frame.addEventListener('load',()=>{try{const d=frame.contentDocument,b=d.getElementById('newswireBtn');if(b){b.textContent='NEWSWIRE PACKAGE';b.onclick=playPackage;const s=b.querySelector('span');if(s)s.textContent='Voice + bed + ID 2'}}catch(e){}});$('#collapse').onclick=()=>{const b=$('#dockBody');const hidden=b.style.display==='none';b.style.display=hidden?'grid':'none';$('#collapse').textContent=hidden?'⌄':'⌃'};</script></body></html>
