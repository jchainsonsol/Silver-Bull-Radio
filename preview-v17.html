<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Bull Radio W3BC — V17</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090c}#board{border:0;width:100%;height:100%;display:block;background:#07090c}</style></head>
<body><iframe id="board" src="preview-v13.html?v=v17" title="Silver Bull Radio"></iframe><audio id="nwVoice" preload="auto"></audio><audio id="nwBed" preload="auto"></audio><audio id="nwId2" preload="auto"></audio>
<script>
const frame=document.getElementById('board'),voice=document.getElementById('nwVoice'),bed=document.getElementById('nwBed'),id2=document.getElementById('nwId2');
const SPACE='https://x.com/i/spaces/1nGnRBYnkjNGO';
const XGROUP='https://x.com/i/chat/group_join/g2074658589738705113/VUKM5PsWPp';
const DISCORD='https://discord.gg/72mX4EGpS7';
const TG='https://t.me/JCHAINStheSilverBull';
const CA='5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';
let cfg={audio:'audio/newswire-today.MP3',bed:'audio/beds/sunset-gate.mp3',handoff:'audio/station-id-2.mp3',bed_level:.10,voice_level:1,auto_station_id:true},nwRunning=false;
const DEFAULT_SCHEDULE={
 '9':[ {type:'SHOW OPEN',title:'Show Open + Morning Setup',min:10,topic:'Welcome, morning setup and roadmap'}, {type:'NEWSWIRE',title:'Silver Bull Newswire',min:5,topic:'Automated daily news package'}, {type:'OPEN PANEL',title:'Open Panel',min:20,topic:'Regulation + market structure'}, {type:'MUSIC RUN',title:'Music Reset',min:15,topic:'Auto DJ'}, {type:'OPEN PANEL',title:'Open Panel',min:10,topic:'Room conversation'} ],
 '10':[ {type:'HOURLY BRIEF',title:'10 AM Reset',min:5,topic:'Recap + what is coming'}, {type:'GM GET MONEY',title:'GM Get Money',min:25,topic:'BTC, ETH, SOL, ETFs and macro'}, {type:'MUSIC RUN',title:'Music Reset',min:15,topic:'Auto DJ'}, {type:'OPEN PANEL',title:'Open Panel',min:15,topic:'Markets and charts'} ],
 '11':[ {type:'HOURLY BRIEF',title:'11 AM Reset',min:5,topic:'Recap + what is coming'}, {type:'FOCUS',title:'Tokenization + RWA',min:30,topic:'Tokenized markets and infrastructure'}, {type:'MUSIC RUN',title:'Music Reset',min:15,topic:'Auto DJ'}, {type:'OPEN PANEL',title:'Open Panel',min:10,topic:'RWA discussion'} ],
 '12':[ {type:'HOURLY BRIEF',title:'12 PM Reset',min:5,topic:'Recap + what is coming'}, {type:'FOCUS',title:'Onchain Finance',min:25,topic:'Credit, yield and tokenized Treasuries'}, {type:'MUSIC RUN',title:'Music Reset',min:15,topic:'Auto DJ'}, {type:'OPEN PANEL',title:'Final Open Panel',min:10,topic:'Best conversation on the board'}, {type:'CLOSE',title:'Bullpen Close',min:5,topic:'Recap, thanks and tomorrow'} ]
};
function fmt(s){if(!Number.isFinite(s)||s<0)return'--:--';s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fade(a,to,ms,cb){const from=a.volume,start=performance.now();function f(n){const p=Math.min(1,(n-start)/ms);a.volume=from+(to-from)*p;if(p<1)requestAnimationFrame(f);else cb&&cb()}requestAnimationFrame(f)}
function d(){return frame.contentDocument}
function nowUI(title,sub,left='--:--',kind='segment'){try{const x=d();if(x.getElementById('nowTitle'))x.getElementById('nowTitle').textContent=title;if(x.getElementById('nowSub'))x.getElementById('nowSub').textContent=sub;if(x.getElementById('nowLeft'))x.getElementById('nowLeft').textContent=left;if(x.getElementById('nowKind'))x.getElementById('nowKind').textContent=kind;if(x.getElementById('playerTitle'))x.getElementById('playerTitle').textContent=title;if(x.getElementById('playerDetail'))x.getElementById('playerDetail').textContent=sub}catch(e){}}
async function initNewswire(){try{const r=await fetch('data/newswire-meta.json?v='+Date.now(),{cache:'no-store'});if(r.ok)cfg={...cfg,...await r.json()}}catch(e){}voice.src=cfg.audio+'?v='+Date.now();bed.src=cfg.bed;id2.src=cfg.handoff;voice.volume=cfg.voice_level||1;voice.load();bed.load();id2.load()}
async function playNewswire(){if(nwRunning)return;nwRunning=true;try{[voice,bed,id2].forEach(a=>{a.pause();a.currentTime=0});bed.volume=0;voice.volume=cfg.voice_level||1;nowUI('Silver Bull Newswire','Starting voice + Sunset Gate bed…','--:--','NEWSWIRE');const plays=[bed.play(),voice.play()];await Promise.all(plays);fade(bed,cfg.bed_level||.10,650);nowUI('Silver Bull Newswire','ON AIR · automated daily Newswire',fmt((voice.duration||0)-(voice.currentTime||0)),'NEWSWIRE')}catch(e){nwRunning=false;nowUI('NEWSWIRE ERROR','Audio could not start: '+e.message,'--:--','ERROR')}}
voice.ontimeupdate=()=>{if(!nwRunning)return;const left=(voice.duration||0)-(voice.currentTime||0);nowUI('Silver Bull Newswire','ON AIR · voice + Sunset Gate bed',fmt(left),'NEWSWIRE');try{const x=d(),m=x.getElementById('playerMeter');if(m&&voice.duration)m.style.width=Math.min(100,voice.currentTime/voice.duration*100)+'%'}catch(e){}};
voice.onended=async()=>{if(!nwRunning)return;nowUI('Station ID 2','Newswire complete · station handoff','--:--','STATION ID');if(cfg.auto_station_id!==false){bed.volume=Math.min(cfg.bed_level||.10,.06);try{id2.currentTime=0;await id2.play()}catch(e){fade(bed,0,900,()=>bed.pause());nwRunning=false;nowUI('JChains','Newswire complete · take the room live','--:--','MIC')}}else{fade(bed,0,900,()=>bed.pause());nwRunning=false;nowUI('JChains','Newswire complete · take the room live','--:--','MIC')}};
id2.onended=()=>fade(bed,0,1200,()=>{bed.pause();bed.currentTime=0;nwRunning=false;nowUI('JChains','Newswire complete · take the room live','--:--','MIC')});
function stopNewswire(){nwRunning=false;[voice,bed,id2].forEach(a=>{a.pause();try{a.currentTime=0}catch(e){}});nowUI('Manual Control','Audio stopped','--:--','MIC')}
function schedule(){try{return JSON.parse(localStorage.getItem('sbr17schedule'))||structuredClone(DEFAULT_SCHEDULE)}catch(e){return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE))}}
function saveSchedule(s){localStorage.setItem('sbr17schedule',JSON.stringify(s))}
function injectStyles(){const st=d().createElement('style');st.textContent=`
#sbr17HourTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.s17hour{border:1px solid var(--line);background:#0b1118;color:var(--txt);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}.s17hour.active{border-color:var(--cyan);color:var(--cyan);background:rgba(57,216,255,.07)}.s17hourPanel{display:none}.s17hourPanel.active{display:block}.s17stat{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px;padding:7px 9px;border:1px solid #26313d;border-radius:8px;background:#0a0f15}.s17stat b{font-size:12px}.s17ok{color:var(--green)}.s17bad{color:var(--yellow)}.s17row{display:grid;grid-template-columns:130px minmax(170px,1fr) 70px minmax(180px,1.5fr) auto;gap:6px;align-items:center;padding:6px;border:1px solid #26313d;border-radius:9px;background:#0a0f15;margin-bottom:5px}.s17row input,.s17row select{width:100%;background:#080d13;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px;font-size:10px}.s17overallHour{margin-bottom:10px}.s17overallHour h3{font-size:11px;color:var(--cyan);margin:4px 0 6px}.s17links{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.s17links button{text-align:left}@media(max-width:800px){.s17row{grid-template-columns:1fr 1fr}.s17row .s17topic{grid-column:1/-1}.s17links{grid-template-columns:1fr}}
`;d().head.appendChild(st)}
let sched=schedule(),activeHour='overall';
function hourLabel(h){return h==='9'?'9–10 AM':h==='10'?'10–11 AM':h==='11'?'11 AM–12 PM':'12–1 PM'}
function totalHour(h){return (sched[h]||[]).reduce((a,b)=>a+(+b.min||0),0)}
function rowHTML(h,item,i){const types=['SHOW OPEN','NEWSWIRE','HOURLY BRIEF','GM GET MONEY','OPEN PANEL','FOCUS','MUSIC RUN','STATION ID','CLOSE'];return `<div class="s17row" data-h="${h}" data-i="${i}"><select class="s17type">${types.map(t=>`<option ${t===item.type?'selected':''}>${t}</option>`).join('')}</select><input class="s17title" value="${esc(item.title)}"><input class="s17min" type="number" min="1" max="60" value="${+item.min||5}"><input class="s17topic s17topic" value="${esc(item.topic||'')}"><button class="mini red s17del">×</button></div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderSchedule(){const x=d(),root=x.getElementById('sbr17Schedule');if(!root)return;let tabs=`<div id="sbr17HourTabs"><button class="s17hour ${activeHour==='overall'?'active':''}" data-v="overall">OVERALL 9–1</button>${['9','10','11','12'].map(h=>`<button class="s17hour ${activeHour===h?'active':''}" data-v="${h}">${hourLabel(h)}</button>`).join('')}</div>`;let overall=`<div class="s17hourPanel ${activeHour==='overall'?'active':''}" data-panel="overall">${['9','10','11','12'].map(h=>`<div class="s17overallHour"><h3>${hourLabel(h)} · ${totalHour(h)} / 60 min</h3>${(sched[h]||[]).map((b,i)=>`<div class="story"><b>${b.type} · ${b.min} min · ${esc(b.title)}</b><p>${esc(b.topic||'')}</p></div>`).join('')}</div>`).join('')}</div>`;let hours=['9','10','11','12'].map(h=>{const t=totalHour(h),delta=60-t;return `<div class="s17hourPanel ${activeHour===h?'active':''}" data-panel="${h}"><div class="s17stat"><b>${hourLabel(h)}</b><span class="${t===60?'s17ok':'s17bad'}">${t}/60 min ${t===60?'✓':delta>0?`· ${delta} min open`:`· ${Math.abs(delta)} min over`}</span></div>${(sched[h]||[]).map((b,i)=>rowHTML(h,b,i)).join('')}<button class="mini s17add" data-h="${h}">+ ADD BLOCK</button></div>`}).join('');root.innerHTML=tabs+overall+hours;root.querySelectorAll('.s17hour').forEach(b=>b.onclick=()=>{activeHour=b.dataset.v;renderSchedule()});root.querySelectorAll('.s17row').forEach(r=>{const h=r.dataset.h,i=+r.dataset.i;const sync=()=>{sched[h][i]={type:r.querySelector('.s17type').value,title:r.querySelector('.s17title').value,min:+r.querySelector('.s17min').value||1,topic:r.querySelector('.s17topic').value};saveSchedule(sched);refreshRundown()};r.querySelectorAll('input,select').forEach(el=>el.onchange=sync);r.querySelector('.s17del').onclick=()=>{sched[h].splice(i,1);saveSchedule(sched);renderSchedule();refreshRundown()}});root.querySelectorAll('.s17add').forEach(b=>b.onclick=()=>{sched[b.dataset.h].push({type:'OPEN PANEL',title:'New Block',min:10,topic:''});saveSchedule(sched);renderSchedule();refreshRundown()})}
function refreshRundown(){try{const x=d(),q=x.getElementById('quickRundown');if(q){q.innerHTML=['9','10','11','12'].map(h=>`<div class="story"><b>${hourLabel(h)}</b><p>${(sched[h]||[]).map(b=>`${b.title} (${b.min})`).join(' → ')}</p></div>`).join('')}const flat=['9','10','11','12'].flatMap(h=>(sched[h]||[]).map(b=>({...b,h})));const up=x.getElementById('upNext');if(up&&flat.length)up.textContent=flat[0].title}catch(e){}}
function buildShowEditor(){const x=d(),show=x.getElementById('show');if(!show)return;const old=show.querySelector('.panel');if(old)old.style.display='none';const p=x.createElement('div');p.className='panel';p.innerHTML=`<div class="head"><h2>9 AM–1 PM Show Planner</h2><div class="row"><button id="s17Save" class="mini cyan">SAVE</button><button id="s17Reset" class="mini red">RESET</button></div></div><div class="body"><div id="sbr17Schedule"></div></div>`;show.prepend(p);x.getElementById('s17Save').onclick=()=>{saveSchedule(sched);refreshRundown()};x.getElementById('s17Reset').onclick=()=>{sched=JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));saveSchedule(sched);renderSchedule();refreshRundown()};renderSchedule();refreshRundown()}
function setupSocial(){const x=d(),list=x.querySelector('#social .templateList'),ta=x.getElementById('xText');if(!list||!ta)return;const posts={
 live:`Silver Bull Radio is LIVE on W3BC.\n\nWelcome to the Bullpen. Markets, crypto, tokenization, music and the conversations that matter.\n\n${SPACE}`,
 next:`NEXT UP on Silver Bull Radio W3BC:\n\n[ADD NEXT TOPIC]\n\nJump into the Bullpen: ${SPACE}`,
 repost:`If you're listening to Silver Bull Radio, hit the purple pill, repost the Space and tag somebody who belongs in the Bullpen.\n\n${SPACE}`,
 xgroup:`Want to stay in the conversation after the mic turns off? Join the Silver Bull X Group:\n\n${XGROUP}`,
 discord:`The Bullpen keeps moving after the show. Join us on Discord:\n\n${DISCORD}`,
 telegram:`Join the $JCHAINS community on Telegram:\n\n${TG}`,
 jchains:`$JCHAINS is the community token powering the Silver Bull ecosystem.\n\nCA: ${CA}\n\nTelegram: ${TG}`,
 midshow:`Silver Bull Radio mid-show reset:\n\nWe've covered [TOPIC 1], [TOPIC 2] and [TOPIC 3]. Still ahead: [WHAT'S NEXT].\n\nAppreciate everyone hanging in the Bullpen with us.` ,
 thanks:`That's a wrap on Silver Bull Radio W3BC for today.\n\nHuge thank you to everyone who listened, spoke, reposted and helped us build day by day.\n\nWe'll take what worked, fix what didn't and come back 1% better tomorrow.\n\nWelcome to the Bullpen.`
};list.innerHTML=`<div class="s17links"><button class="mini" data-p="live">WE ARE LIVE</button><button class="mini" data-p="next">NEXT UP</button><button class="mini" data-p="repost">PURPLE PILL / REPOST</button><button class="mini" data-p="xgroup">X GROUP CTA</button><button class="mini" data-p="discord">DISCORD CTA</button><button class="mini" data-p="telegram">TELEGRAM CTA</button><button class="mini" data-p="jchains">$JCHAINS / CA</button><button class="mini" data-p="midshow">MID-SHOW RECAP</button><button class="mini" data-p="thanks">THANK YOU / RECAP</button></div>`;list.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>ta.value=posts[b.dataset.p]);const add=x.getElementById('addSpace');if(add)add.onclick=()=>{if(!ta.value.includes(SPACE))ta.value+=(ta.value?'\n\n':'')+SPACE}}
function patchControls(){const x=d(),wrap=x.querySelector('#control .controls'),go=x.getElementById('goLive'),nw=x.getElementById('newswireMain');if(wrap&&go&&nw){go.after(nw);nw.textContent='NEWSWIRE';const sp=x.createElement('span');sp.textContent='One tap · voice + bed + ID 2';nw.appendChild(sp);nw.onclick=playNewswire}const mainScript=x.getElementById('mainScript');if(mainScript)mainScript.placeholder='Host-read material only: monologue, hourly briefs and fill prompts.';const stop=x.getElementById('stopAll');if(stop){const old=stop.onclick;stop.onclick=e=>{stopNewswire();if(typeof old==='function')old.call(stop,e)}}}
frame.addEventListener('load',()=>{injectStyles();patchControls();buildShowEditor();setupSocial();refreshRundown()});
initNewswire();
</script></body></html>
